<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Opções de fonte · Aniadny + Vinícius</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #FCFCFA; --bg-alt: #F1F4EE; --ink: #1F2A22; --muted: #66705F; --accent: #3E5C46; --leaf: #7F9C7C; --line: #DFE5DA; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg-alt); color: var(--ink); font-family: "Montserrat", system-ui, sans-serif; font-weight: 300; padding: 40px 16px 64px; }
  header { max-width: 1100px; margin: 0 auto 32px; text-align: center; }
  header h1 { font-weight: 500; font-size: 22px; letter-spacing: .04em; }
  header p { color: var(--muted); margin-top: 8px; font-size: 14px; }
  header a { color: var(--accent); }
  .grid { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 18px; }
  .opt { background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 34px 20px 20px; text-align: center; display: flex; flex-direction: column; }
  .names { font-size: calc(30px * var(--name-scale, 1)); line-height: 1.25; font-weight: 400; min-height: 2.6em; display: grid; place-items: center; }
  .names .plus { color: var(--leaf); margin: 0 .25em; }
  .date { font-weight: 600; letter-spacing: .14em; color: #444; margin-top: 10px; font-size: 18px; }
  .meta { margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: left; }
  .meta strong { display: block; font-weight: 600; font-size: 14px; }
  .meta span { font-size: 12px; color: var(--muted); }
  .meta a { flex-shrink: 0; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; text-decoration: none; color: #fff; background: var(--accent); padding: 9px 14px; border-radius: 999px; }
  .num { font-size: 11px; color: var(--leaf); letter-spacing: .2em; font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1>Opções de fonte para o nome do casal</h1>
  <p>Escolha pelo número. “Ver no site” abre a página com a fonte aplicada no cabeçalho. <a href="./">Voltar ao site</a></p>
</header>
<div class="grid" id="grid"></div>
<script src="fontes.js"></script>
<script>
  const grid = document.getElementById("grid");
  NAME_FONTS.forEach((f, i) => {
    const card = document.createElement("article");
    card.className = "opt";
    card.innerHTML = `
      <div class="num">OPÇÃO ${i + 1}</div>
      <div class="names">Aniadny<span class="plus">+</span>Vinícius</div>
      <div class="date">01.05.2027</div>
      <div class="meta"><div><strong>${f.name}</strong><span>${f.note}</span></div><a href="./?fonte=${f.id}#inicio">Ver no site</a></div>`;
    grid.appendChild(card);
    applyNameFont(card.querySelector(".names"), f);
  });
</script>
</body>
</html>
